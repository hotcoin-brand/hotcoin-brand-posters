function sw(l){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));if(l==='en'){document.querySelectorAll('.tab')[0].classList.add('on');document.getElementById('p-en').classList.add('on')}else{document.querySelectorAll('.tab')[1].classList.add('on');document.getElementById('p-cn').classList.add('on')}}
function oLB(i){ci=i;upd();document.getElementById('lb').classList.add('open');document.body.style.overflow='hidden'}
function cls(){document.getElementById('lb').classList.remove('open');document.body.style.overflow=''}
function nav(d){ci=(ci+d+P.length)%P.length;upd()}
function upd(){const p=P[ci];document.getElementById('lbi').src=p.f;document.getElementById('lbti').textContent=p.t;document.getElementById('lbdl').href=p.f;document.getElementById('lbdl').download=p.d;document.getElementById('lbc').textContent=(ci+1)+'/'+P.length}
document.addEventListener('keydown',e=>{if(!document.getElementById('lb').classList.contains('open'))return;if(e.key==='Escape')cls();if(e.key==='ArrowLeft')nav(-1);if(e.key==='ArrowRight')nav(1)});
document.getElementById('lb').addEventListener('click',e=>{if(e.target===document.getElementById('lb'))cls()});
